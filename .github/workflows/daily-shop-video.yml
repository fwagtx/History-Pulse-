name: Daily shop video

# The Fortnite shop rotates at 00:00 UTC. Build just after, so the day's three
# videos are ready long before the first post slot (10:00 America/Chicago).
# The shop source can lag the rotation by hours, so later runs try again; each
# one stops straight away once the day's videos are out, and the last try is
# still hours before the 7 AM Central Routine schedules them.
on:
  schedule:
    - cron: "20 0 * * *"
    - cron: "20 2 * * *"
    - cron: "20 4 * * *"
    - cron: "20 6 * * *"
    - cron: "20 9 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
    inputs:
      formats:
        description: >-
          Optional: re-make only these formats for today's shop, e.g.
          this_or_that,guess_price. They go to a release of their own
          (shop-DATE-remake), so the day's main set is left alone.
        required: false
        default: ""
      looks:
        description: >-
          Optional: preview new looks (creator-code/LOOKS.md), e.g. "all" or
          "og_check,bundle_math". Needs formats. Goes to a preview-shop-DATE
          release that nothing schedules.
        required: false
        default: ""

permissions:
  contents: write           # needed to publish the release that hosts the videos

# One build at a time: a retry never races a build that is still waiting.
concurrency:
  group: daily-shop-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # A scheduled retry has nothing to do once today's videos are published.
      # (Runs started by hand always build.)
      - name: Skip if today's videos are already out
        id: skip
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="shop-$(date -u +%F)"
          if [ "$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already published; nothing to do."
          fi

      - uses: actions/checkout@v4
        if: steps.skip.outputs.done != 'true'
        with:
          ref: claude/creator-code-bad-automation-0jjc1k

      - uses: actions/setup-python@v5
        if: steps.skip.outputs.done != 'true'
        with:
          python-version: "3.11"

      # Playwright drives Chromium frame by frame; numpy synthesizes the
      # soundtrack. Both are free and open source.
      - name: Install ffmpeg, Chromium, Python deps
        if: steps.skip.outputs.done != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q playwright==1.56.0 numpy
          python -m playwright install --with-deps chromium
          ffmpeg -version | head -1

      # The shop comes from a keyless GitHub mirror, so no secret is required.
      # The official API is the fallback, with FORTNITE_API_KEY if that is set.
      - name: Write config
        if: steps.skip.outputs.done != 'true'
        env:
          FORTNITE_API_KEY: ${{ secrets.FORTNITE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          cfg = json.loads(pathlib.Path("creator-code/config.example.json").read_text())
          cfg["fortnite_api_key"] = os.environ.get("FORTNITE_API_KEY", "")
          cfg["telegram_bot_token"] = ""
          cfg["telegram_chat_id"] = ""
          cfg["video_out_dir"] = ""
          pathlib.Path("creator-code/config.json").write_text(json.dumps(cfg, indent=2))
          print("config written, key present:", bool(cfg["fortnite_api_key"]))
          PY

      - name: Build today's videos
        id: build
        if: steps.skip.outputs.done != 'true'
        env:
          FORMATS: ${{ inputs.formats }}
          LOOKS: ${{ inputs.looks }}
        run: |
          set -e
          STAMP=$(date -u +%F)
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          if [ -n "$LOOKS" ]; then
            [[ "$LOOKS" =~ ^[a-z_@,]+$ ]] || { echo "::error::looks must look like all or og_check,bundle_math"; exit 1; }
            [[ "$FORMATS" =~ ^[a-z_]+(,[a-z_]+)*$ ]] || { echo "::error::a looks preview needs formats"; exit 1; }
            TAG="preview-shop-$STAMP"
            echo "title=Item shop $STAMP (preview looks: $LOOKS)" >> "$GITHUB_OUTPUT"
            CC_LOOKS="$LOOKS" python3 scripts/cc_build.py --only "$FORMATS" --release "$TAG"
          elif [ -n "$FORMATS" ]; then
            [[ "$FORMATS" =~ ^[a-z_]+(,[a-z_]+)*$ ]] || { echo "::error::formats must look like this_or_that,guess_price"; exit 1; }
            TAG="shop-$STAMP-remake"
            echo "title=Item shop $STAMP (remade: $FORMATS)" >> "$GITHUB_OUTPUT"
            python3 scripts/cc_build.py --only "$FORMATS" --release "$TAG"
          else
            TAG="shop-$STAMP"
            echo "title=Item shop $STAMP" >> "$GITHUB_OUTPUT"
            python3 scripts/cc_build.py
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls -la "creator-code/out/$STAMP/"
          cat "creator-code/out/$STAMP/manifest.json"

      - name: Publish to a release (this is what gives each video a public URL)
        if: steps.skip.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          TITLE: ${{ steps.build.outputs.title }}
        run: |
          set -e
          STAMP="${{ steps.build.outputs.stamp }}"
          DIR="creator-code/out/$STAMP"
          NOTES="Auto-generated shop videos for $STAMP. manifest.json lists post times, titles and captions."
          FILES=("$DIR"/bad-*.mp4 "$DIR"/bad-*-cover.png "$DIR"/bad-*-qa.jpg "$DIR/manifest.json")
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            # Same-day re-run: swap the files in place and keep the tag. Deleting
            # and re-creating a tag seconds apart can leave the release stuck as
            # a private draft.
            for a in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              gh release delete-asset "$TAG" "$a" --yes
            done
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --draft=false --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" "${FILES[@]}"
          fi
          # gh uploads into a draft and then publishes it. Make sure that took:
          # Metricool can only fetch from a public release.
          for i in 1 2 3 4 5 6; do
            [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "false" ] && break
            sleep 5
            gh release edit "$TAG" --draft=false || true
          done
          [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "false" ] || { echo "::error::release $TAG is still a draft"; exit 1; }
          curl -fsSL -o /dev/null "https://github.com/${{ github.repository }}/releases/download/$TAG/manifest.json"
          echo "Public. VIDEO URLS:"
          python3 -c "import json;[print(v['post_at_local'], v['url']) for v in json.load(open('$DIR/manifest.json'))['videos']]"
